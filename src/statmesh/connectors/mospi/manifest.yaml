id: mospi
name: MoSPI eSankhyiki (Ministry of Statistics and Programme Implementation, India)
kind: custom
endpoint: https://api.mospi.gov.in
auth: none
key_required: false
licence:
  name: MoSPI Copyright Policy (GSDD 2026 Category A; attribution, no endorsement)
  url: https://www.mospi.gov.in/CopyrightPolicy
  redistribute: "yes"  # NSO datasets; RBI datasets override to review below. No MoSPI logo in the web UI or docs.
  attribution: "Source: Ministry of Statistics and Programme Implementation (MoSPI), Government of India. Data reformatted by statmesh; not endorsed by MoSPI."
rate_limit:
  per_second: 1
# Mirrored weekly (hosted free site, `statmesh mirror`): headline NSO datasets that fetch fully without a year or
# state filter. Sized by probing totalRecords on 2026-11-26 (200 rows per request, 1 req/s, one request per
# indicator per page); about 220 requests, 4-6 minutes in all:
#   plfs_annual ~21, plfs_quarterly ~9, plfs_monthly ~9, cpi ~96, iip_annual ~8, nas_annual ~11,
#   nas_quarterly ~4, tus ~40, asuse_annual ~6, asuse_quarterly ~4, nss72t_tourism ~10.
# Left on demand: wpi (147k rows, the 20k row cap would keep only the oldest), iip_monthly (17k rows, near the
# cap), isp_* (default year is the previous and current FY; the newest has no data yet, so they are not mirrored), asi / hces / energy_*
# (large per-NIC, per-state or per-commodity cross-sections), and every `review` dataset (never mirrored).
core_datasets:
  [plfs_annual, plfs_quarterly, plfs_monthly, cpi, iip_annual, nas_annual, nas_quarterly, tus, asuse_annual, asuse_quarterly, nss72t_tourism]
refresh:
  schedule: "0 3 * * 1"
# Per-dataset options read by connector.py:
#   path       API path.  params: fixed query params.  all_india: params that select the national row.
#   period     cy ("PLFS 2022"), cyq (calendar year + quarter label), monthly (year + month name),
#              fy ("2025-26", April-March), fyq (fiscal year + "Q1".."Q4"), fym (fiscal year + month name),
#              span ("1951", "2016-20", "2023-24" = April-March,
#              "July 2014 - June 2015": a calendar year or a multi-year/multi-month survey span).
#   max_rows   row cap per indicator when the request sets none (default 20,000).
#   page_size  rows per request when the API caps `limit` below 200.
#   indicators id -> {code, title, unit?}; unit, when set, wins over the API row's unit; one request per id, sent as `code_param`.
#   values     API field -> [indicator suffix, title, unit]; unit None = use the row's `unit`.
#   licence    optional per-dataset override of the source licence (e.g. {redistribute: review}).
#   default_year  year param sent when none is given (the API times out unfiltered); "current_fy" = today's
#              Indian FY (April-March, IST). With no start and no `year` filter, both the previous and the
#              current FY are requested (the API lists the new FY before it has data); an explicit `year`
#              sends only that year; with req.start, every FY from start to end is requested.
#   dims       API field -> dim name (null fields are dropped).  geo: API field holding the state.
datasets:
  plfs_annual:
    title: PLFS annual (calendar-year rounds)
    path: /api/plfs/getData
    params: {frequency_code: 1}
    all_india: {state_code: 99}
    period: cy
    year: year
    code_param: indicator_code
    indicators: &plfs
      lfpr: {code: 1, title: Labour force participation rate}
      wpr: {code: 2, title: Worker population ratio}
      ur: {code: 3, title: Unemployment rate}
    values: {value: ["", "", null]}
    geo: state
    dims: &plfs_dims {gender: gender, sector: sector, AgeGroup: age_group, weekly_status: weekly_status, religion: religion, socialGroup: social_group, General_Education: education}
  plfs_quarterly:
    title: PLFS quarterly bulletin (urban)
    path: /api/plfs/getData
    params: {frequency_code: 2}
    all_india: {state_code: 99}
    period: cyq
    year: year
    code_param: indicator_code
    indicators: *plfs
    values: {value: ["", "", null]}
    geo: state
    dims: *plfs_dims
  plfs_monthly:
    title: PLFS monthly bulletin
    path: /api/plfs/getData
    params: {frequency_code: 3}
    all_india: {state_code: 99}
    period: monthly
    year: year
    code_param: indicator_code
    indicators: *plfs
    values: {value: ["", "", null]}
    geo: state
    dims: *plfs_dims
  cpi:
    max_rows: 100000  # ~19k all-India rows today, close to the 20k default cap; the cap would drop the newest months
    title: Consumer Price Index (combined/rural/urban, group and subgroup)
    path: /api/cpi/getCPIIndex
    params: {}
    all_india: {state_code: 99}
    period: monthly
    year: year
    values: {index: [index, Index, index], inflation: [inflation, Year-on-year inflation, percent]}
    geo: state
    dims: {baseyear: base_year, sector: sector, group: group, subgroup: subgroup}
  wpi:
    title: Wholesale Price Index (major group down to item)
    path: /api/wpi/getWpiRecords
    params: {}
    period: monthly
    year: year
    values: {index_value: [index, Index, index]}
    dims: {base_year: base_year, majorgroup: major_group, group: group, subgroup: subgroup, sub_subgroup: sub_subgroup, item: item}
  iip_annual:
    title: Index of Industrial Production, annual (financial year)
    path: /api/iip/getIipAnnual
    params: {}
    period: fy
    year: year
    values: {index: [index, Index, index], growth_rate: [growth_rate, Growth rate, percent]}
    dims: {base_year: base_year, type: type, category: category, sub_category: sub_category}
  iip_monthly:
    title: Index of Industrial Production, monthly
    path: /api/iip/getIipMonthly
    params: {}
    period: monthly
    year: year
    values: {index: [index, Index, index], growth_rate: [growth_rate, Growth rate, percent]}
    dims: {base_year: base_year, type: type, category: category, sub_category: sub_category}
  nas_annual:
    title: National Accounts Statistics, annual (financial year)
    path: /api/nas/getNASData
    params: {series: Current, frequency_code: 1}
    period: fy
    year: year
    code_param: indicator_code
    indicators: &nas
      gva: {code: 1, title: Gross value added}
      gdp: {code: 5, title: Gross domestic product}
      ndp: {code: 7, title: Net domestic product}
    values: {current_price: [current, at current prices, null], constant_price: [constant, at constant prices, null]}
    dims: &nas_dims {base_year: base_year, revision: revision, industry: industry, subindustry: subindustry, institutional_sector: institutional_sector}
  nas_quarterly:
    title: National Accounts Statistics, quarterly (financial year quarters)
    path: /api/nas/getNASData
    params: {series: Current, frequency_code: 2}
    period: fyq
    year: year
    code_param: indicator_code
    indicators: *nas
    values: {current_price: [current, at current prices, null], constant_price: [constant, at constant prices, null]}
    dims: *nas_dims
  # State-level NAS (GSDP, NSDP, per-capita, growth, GSVA/NSVA by industry); indicator codes 23-34.
  nas_state_annual:
    licence: {redistribute: review}  # GSDP/NSDP are compiled by state Directorates of Economics and Statistics, not NSO
    title: National Accounts Statistics, state-level (financial year)
    path: /api/nas/getNASData
    params: {series: Current, frequency_code: 1}
    period: fy
    year: year
    code_param: indicator_code
    indicators:
      gsdp: {code: 23, title: Gross State Domestic Product}
      nsdp: {code: 24, title: Net State Domestic Product}
      pc_nsdp: {code: 25, title: Per capita net state domestic product}
      gsdp_growth: {code: 26, title: GSDP growth rate}
      nsdp_growth: {code: 27, title: NSDP growth rate}
      pc_nsdp_growth: {code: 28, title: Per capita NSDP growth rate}
      gsva: {code: 29, title: Gross state value added}
      nsva: {code: 30, title: Net state value added}
      pc_gsdp_rs: {code: 31, title: Per capita GSDP}
      pc_nsdp_rs: {code: 32, title: Per capita NSDP}
      taxes_on_products: {code: 33, title: Taxes on products}
      subsidies_on_products: {code: 34, title: Subsidies on products}
    values: {current_price: [current, at current prices, null], constant_price: [constant, at constant prices, null]}
    geo: state
    dims: {base_year: base_year, industry: industry, subindustry: subindustry}
  # Annual Survey of Industries; classification_year is the NIC revision. A subset of the ~57 indicators.
  asi:
    title: Annual Survey of Industries (factory sector, by NIC industry and state)
    path: /api/asi/getASIData
    params: {classification_year: 2008}
    period: fy
    year: year
    code_param: indicator_code
    indicators:
      factories: {code: 1, title: Number of factories}
      fixed_capital: {code: 3, title: Fixed capital}
      total_output: {code: 15, title: Total output}
      gva: {code: 19, title: Gross value added}
      nva: {code: 21, title: Net value added}
      net_profit: {code: 30, title: Net profit}
      persons_engaged: {code: 31, title: Total number of persons engaged}
      workers: {code: 32, title: Total number of workers}
    values: {value: ["", "", null]}
    geo: state
    dims: {sector: sector, nic_type: nic_type, nic_code: nic_code, nic_description: nic_description}
  # Household Consumption Expenditure Survey (2022-23, 2023-24). Unfiltered requests time out, so
  # default_year (latest published, probed 2026-11-26: 2024-25 and later return "No Data Found") is
  # sent when the request gives no start/year filter; req.start maps to the financial year.
  hces:
    default_year: "2023-24"
    title: Household Consumption Expenditure Survey (MPCE, shares, Gini)
    path: /api/hces/getHcesRecords
    params: {}
    period: fy
    year: year
    code_param: indicator_code
    indicators:
      mpce: {code: 1, title: Average monthly per capita consumption expenditure}
      mpce_category: {code: 3, title: MPCE over broad item categories}
      mpce_share: {code: 4, title: Percentage share of MPCE over broad item categories}
      gini: {code: 9, title: Gini coefficient of per capita consumption expenditure}
    values: {value: ["", "", null]}
    geo: state
    dims: {sector: sector, imputation_type: imputation_type, item_category: item_category}
  # Energy balance; the API requires use_of_energy_balance_code (1 supply, 2 consumption) and returns no unit field.
  energy_supply:
    title: Energy balance, supply side (financial year)
    path: /api/energy/getEnergyRecords
    params: {use_of_energy_balance_code: 1, Format: JSON}
    period: fy
    year: year
    code_param: indicator_code
    indicators: &energy
      ktoe: {code: 1, title: Energy balance in KToE, unit: KToE}
      pj: {code: 2, title: Energy balance in PetaJoules, unit: PJ}
    values: {value: ["", "", null]}
    dims: &energy_dims {energy_commodities: energy_commodity, energy_sub_commodities: energy_sub_commodity, end_use_sector: end_use_sector, end_use_sub_sector: end_use_sub_sector}
  energy_consumption:
    title: Energy balance, consumption side (financial year)
    path: /api/energy/getEnergyRecords
    params: {use_of_energy_balance_code: 2, Format: JSON}
    period: fy
    year: year
    code_param: indicator_code
    indicators: *energy
    values: {value: ["", "", null]}
    dims: *energy_dims
  # RBI (Handbook of Statistics) tables served by MoSPI; one sub_indicator_code per dataset, each with its own dims.
  rbi_trade_inr:
    licence: {redistribute: review}  # RBI content is not NSO's to license
    title: RBI Direction of Foreign Trade, rupees (partner country groups)
    path: /api/rbi/getRbiRecords
    params: {sub_indicator_code: 1}
    period: fy
    year: year
    values: {value: [value, Value, null]}
    dims: {country_group: country_group, country_sub_group: country_sub_group, countries: countries, trade: trade}
  rbi_bop:
    licence: {redistribute: review}  # RBI content is not NSO's to license
    title: RBI Balance of Payments indicators
    path: /api/rbi/getRbiRecords
    params: {sub_indicator_code: 22}
    period: fy
    year: year
    values: {value: [value, Value, null]}
    dims: {balance_of_payments: balance_of_payments, trade_category: trade_category}
  rbi_fx_annual:
    licence: {redistribute: review}  # RBI content is not NSO's to license
    title: RBI annual average rupee exchange rate (calendar year)
    path: /api/rbi/getRbiRecords
    params: {sub_indicator_code: 32}
    period: cy
    year: year
    values: {value: [value, Value, null]}
    dims: {currency: currency}
  # Index of Service Production (base 2024-25, NSO). Only 2025-26 onwards is published; unfiltered requests
  # send the previous and the current FY (the API lists 2026-27 but returns "No Data Found" for it for now).
  isp_annual:
    default_year: current_fy
    title: Index of Service Production, annual (financial year)
    path: /api/isp/getISPRecords
    params: {frequency_code: 1, Format: JSON}
    period: fy
    year: year
    values: {index: [index, Index, index], growth_rate: [growth_rate, Growth rate, percent]}
    dims: {base_year: base_year, broad_sub_sector: broad_sub_sector}
  isp_monthly:
    default_year: current_fy
    title: Index of Service Production, monthly
    path: /api/isp/getISPRecords
    params: {frequency_code: 2, Format: JSON}
    period: fym
    year: year
    values: {index: [index, Index, index], growth_rate: [growth_rate, Growth rate, percent]}
    dims: {base_year: base_year, broad_sub_sector: broad_sub_sector}
  # Services Producer Price Index, quarterly; the API requires sppi_code and caps limit at 100. SPPI has
  # historically been compiled by DPIIT's Office of the Economic Adviser, not NSO, and MoSPI metadata names no owner.
  sppi:
    licence: {redistribute: review}
    title: Services Producer Price Index (quarterly, financial year)
    path: /api/sppi/get-records
    params: {Format: JSON}
    page_size: 100
    period: fyq
    year: financial_year
    code_param: sppi_code
    indicators:
      securities: {code: 1, title: Securities transaction service price index}
      banking: {code: 2, title: Banking service price index}
      insurance: {code: 5, title: Insurance service price index}
      telecom: {code: 6, title: Telecom service price index}
      railway: {code: 7, title: Railway service price index}
      air_passenger: {code: 10, title: Air (passenger) service price index}
    values: {index: ["", "", index]}
    dims: {}
  # CPI for agricultural/rural labourers (base 2019). Compiled by the Labour Bureau (Ministry of Labour), not NSO.
  cpialrl:
    licence: {redistribute: review}  # Labour Bureau, Ministry of Labour & Employment, not NSO
    title: CPI for agricultural and rural labourers (general and group index)
    path: /api/cpialrl/getCpialrlRecords
    params: {Format: JSON}
    all_india: {state_code: 99}
    period: monthly
    year: year
    code_param: indicator_code
    indicators:
      general: {code: 1, title: General index}
      group: {code: 2, title: Group index}
    values:
      index_al: [index_al, Index (agricultural labourers), index]
      index_rl: [index_rl, Index (rural labourers), index]
      inflation_al: [inflation_al, Inflation (agricultural labourers), percent]
      inflation_rl: [inflation_rl, Inflation (rural labourers), percent]
    geo: state
    dims: {base_year: base_year, group: group}
  # Environment statistics MoSPI republishes from IMD, the Forest Survey of India and others. Year labels such as
  # "SFR 2005" / "ISFR 2023" read as the trailing calendar year (cy).
  envstats:
    licence: {redistribute: review}  # compiled by IMD, FSI (MoEFCC) and other agencies, not NSO
    title: Environment statistics (temperature, rainfall, forest area and cover)
    path: /api/env/getEnvStatsRecords
    params: {Format: JSON}
    period: cy
    year: year
    code_param: indicator_code
    indicators:
      mean_temp: {code: 1, title: Annual and seasonal mean temperature}
      rainfall: {code: 3, title: Annual and monthly rainfall}
      forest_area: {code: 18, title: State-wise forest area}
      forest_cover: {code: 20, title: Forest cover}
    values: {value: ["", "", null]}
    geo: state
    dims: {period: season, month: month}
  # Women and Men in India: MoSPI compiles tables from NFHS, SRS, Census, NCRB, UDISE+ and other bodies' data.
  gender_stats:
    licence: {redistribute: review}  # tables compiled from other ministries' and agencies' data
    title: Gender statistics (sex ratio, fertility, mortality, literacy, labour force)
    path: /api/gender/getGenderRecords
    params: {Format: JSON}
    period: span
    year: year
    code_param: indicator_code
    indicators:
      sex_ratio: {code: 2, title: Sex ratio, unit: females per 1000 males}
      tfr: {code: 10, title: Total fertility rate, unit: births per woman}
      imr_state: {code: 16, title: State/UT infant mortality rate, unit: per 1000 live births}
      life_expectancy_state: {code: 19, title: State/UT life expectancy at birth, unit: years}
      mmr: {code: 21, title: Maternal mortality ratio, unit: per 100000 live births}
      literacy: {code: 55, title: Literacy rate (age 7 and above), unit: percent}
      lfpr_15plus: {code: 82, title: Labour force participation rate (age 15 and above), unit: percent}
      ur_15plus: {code: 95, title: Unemployment rate (age 15 and above), unit: percent}
    values: {value: ["", "", null]}
    geo: state/UT
    dims: {sector: sector, gender: gender, education_level: education_level}
  # Time Use Survey (NSO), 2019 and 2024 rounds.
  tus:
    title: Time Use Survey (participation and minutes per day by activity)
    path: /api/tus/getTusRecords
    params: {Format: JSON}
    period: cy
    year: year
    code_param: indicator_code
    indicators:
      pct_major: {code: 9, title: Persons in paid/unpaid/other activity as major activity, unit: percent}
      min_person_major: {code: 11, title: Minutes per day per person in paid/unpaid/other activity as major activity}
      pct_any: {code: 12, title: Persons in paid/unpaid/other activity irrespective of major activity, unit: percent}
      min_person_any: {code: 13, title: Minutes per day per person in paid/unpaid/other activity irrespective of major activity}
    values: {value: ["", "", null]}
    geo: state
    dims: {sector: sector, gender: gender, age_group: age_group, activity: activity}
  # Annual Survey of Unincorporated Sector Enterprises (NSO); state_ut_code 37 is All India.
  asuse_annual:
    title: ASUSE annual (unincorporated enterprises, by state, activity and establishment type)
    path: /api/asuse/getAsuseRecords
    params: {Format: JSON}
    all_india: {state_ut_code: 37}
    period: span  # bare "2025" = calendar year (quarterly bulletins use calendar years from 2025); "2023-24" = April-March.
    # ponytail: ASUSE 2022-23 and 2023-24 may have run Oct-Sep (unverified), so FY-label periods are approximate.
    year: year
    code_param: indicator_code
    indicators:
      gva_per_worker: {code: 33, title: Annual GVA per worker (market establishments), unit: INR}
      gva_per_establishment: {code: 35, title: Annual GVA per establishment (market establishments), unit: INR}
      emoluments_per_hired_worker: {code: 31, title: Annual emoluments per hired worker, unit: INR}
      workers: {code: 27, title: Estimated number of workers by nature of employment and gender, unit: persons}
    values: {value: ["", "", null]}
    geo: state/UT
    dims: {sector: sector, broad_activity_category: activity, establishment_type: establishment_type, gender: gender, working_time: working_time, hired_worker: hired_worker, sub_indicator: sub_indicator}
  asuse_quarterly:
    title: ASUSE quarterly bulletin (unincorporated enterprises)
    path: /api/asuse/getAsuseRecords
    params: {Format: JSON}
    all_india: {state_ut_code: 37}
    period: cyq
    year: year
    code_param: indicator_code
    indicators:
      establishments: {code: 47, title: Number of establishments, unit: hundreds}
      workers: {code: 48, title: Number of workers, unit: hundreds}
      pct_proprietary_partnership: {code: 40, title: Share of proprietary and partnership establishments, unit: percent}
      pct_hired_worker_establishments: {code: 41, title: Share of hired worker establishments, unit: percent}
    values: {value: ["", "", null]}
    geo: state/UT
    dims: {sector: sector, broad_activity_category: activity}
  # NSS 72nd round, domestic tourism (NSO); the row carries survey_period "July 2014 - June 2015". state_code 36 is All India.
  nss72t_tourism:
    title: NSS 72nd round, domestic tourism (trips and expenditure per trip)
    path: /api/nss-72t/getNss72TourismRecords
    params: {Format: JSON}
    period: span
    year: survey_period
    code_param: indicator_code
    indicators:
      overnight_trips: {code: 36, title: Estimated overnight trips by leading purpose (last 365 days)}
      expenditure_per_trip: {code: 32, title: Average expenditure per overnight trip by quintile (last 365 days)}
      households_by_religion: {code: 1, title: Per 1000 households reporting overnight trips by religion}
      visitor_trips: {code: 12, title: Per 1000 distribution of overnight visitor trips}
    values: {value: ["", "", null]}
    geo: state
    dims: {sector: sector, leading_purpose: leading_purpose, "quintile_class_of_UMPCE(percentile)": quintile, religion: religion, gender: gender, visitors_purpose: visitors_purpose}
