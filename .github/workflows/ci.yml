name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Build fixture catalog (offline, from connector fixtures)
        run: uv run python -m statmesh.testing.fixture_catalog evals
      - name: Search eval (a missing catalog fails CI)
        run: STATMESH_EVAL_CATALOG=$PWD/evals/fixture_catalog.sqlite uv run pytest tests/search -rs
      - name: Question benchmark (offline, gated by evals/results/thresholds.json)
        run: uv run statmesh bench

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Single stable required-check name for branch protection.
  ci-ok:
    if: always()
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs must succeed
        run: |
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.web.result }}" = success ]
