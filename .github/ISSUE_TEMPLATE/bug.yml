name: Bug report
description: Something works wrong. A series id, the command and its output help most.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: statmesh version
      description: Output of `statmesh --version`.
      placeholder: "statmesh 0.3.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or request
      description: The exact command, REST call or MCP tool call.
      render: shell
    validations:
      required: true
  - type: input
    id: series
    attributes:
      label: Series id (if any)
      placeholder: "source:dataset:indicator:GEO"
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What you got. Remove any API key or .env value first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security vulnerability. (Vulnerabilities go through SECURITY.md.)
          required: true
