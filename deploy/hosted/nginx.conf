# Public edge for the hosted mirror. Limits return 429. The access log carries no headers and no
# query strings. Behind a CDN or TLS proxy, uncomment set_real_ip_from (see docs/hosted-runbook.md).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # $uri has no query string; no header is logged.
  log_format minimal '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout minimal;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  limit_req_status 429;
  limit_conn_status 429;

  # set_real_ip_from 172.16.0.0/12;   # the TLS proxy / CDN address range
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;

  # POST /shares only: other methods get an empty key, which nginx does not count.
  map $request_method $share_post_key {
    POST    $binary_remote_addr;
    default "";
  }

  limit_req_zone $binary_remote_addr zone=heavy:10m rate=30r/m;
  limit_req_zone $share_post_key     zone=shares:10m rate=1r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;
  limit_conn_zone $binary_remote_addr zone=heavy_conn:10m;

  upstream api { server api:8000; keepalive 8; }
  upstream web { server web:3000; keepalive 8; }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_hide_header X-Powered-By;

  server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 64k;
    limit_req zone=general burst=40 nodelay;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # SQL and MCP: 30/min, 2 connections, 64 KB. /api/query and /chat/api reach the same engine
    # through the web app, so they share the limits.
    location ~ ^/(query|mcp)(/|$) {
      limit_req zone=heavy burst=10 nodelay;
      limit_conn heavy_conn 2;
      proxy_read_timeout 60s;
      proxy_buffering off;  # MCP streams
      proxy_pass http://api;
    }

    # Whole REST API under /v1/ (SDK base URL https://<host>/v1); the prefix is stripped. Host is
    # passed through, so STATMESH_ALLOWED_HOSTS applies unchanged. Regex locations win over the
    # plain /v1/ prefix below, so the heavy and share routes are matched explicitly.
    location ~ ^/v1/(query|mcp)(/|$) {
      limit_req zone=heavy burst=10 nodelay;
      limit_conn heavy_conn 2;
      rewrite ^/v1/(.*)$ /$1 break;
      proxy_read_timeout 60s;
      proxy_buffering off;  # MCP streams
      proxy_pass http://api;
    }

    location ~ ^/v1/series/.+/observations\.csv$ {  # streamed export, same cost class as /api/series-csv
      limit_req zone=heavy burst=10 nodelay;
      limit_conn heavy_conn 2;
      rewrite ^/v1/(.*)$ /$1 break;
      proxy_read_timeout 600s;
      proxy_buffering off;
      proxy_pass http://api;
    }

    location ^~ /v1/shares {
      limit_req zone=shares burst=10 nodelay;
      limit_req zone=general burst=40 nodelay;
      client_max_body_size 256k;
      rewrite ^/v1/(.*)$ /$1 break;
      proxy_pass http://api;
    }

    location /v1/ { proxy_pass http://api/; }

    # The web app's CSV download: a long streamed export, so heavy limits and a long read timeout.
    location = /api/series-csv {
      limit_req zone=heavy burst=10 nodelay;
      limit_conn heavy_conn 2;
      proxy_read_timeout 600s;
      proxy_buffering off;
      proxy_pass http://web;
    }

    location ~ ^/(api/query|chat/api)(/|$) {
      limit_req zone=heavy burst=10 nodelay;
      limit_conn heavy_conn 2;
      client_max_body_size 256k;  # chat history
      proxy_read_timeout 120s;
      proxy_buffering off;  # chat streams
      proxy_pass http://web;
    }

    location /shares {
      limit_req zone=shares burst=10 nodelay;
      limit_req zone=general burst=40 nodelay;
      client_max_body_size 256k;
      proxy_pass http://api;
    }

    # The UI's share button posts here (web forwards to the API); same limits as POST /shares.
    location = /api/share {
      limit_req zone=shares burst=10 nodelay;
      limit_req zone=general burst=40 nodelay;
      client_max_body_size 256k;
      proxy_pass http://web;
    }

    location = /healthz { proxy_pass http://api; }

    location / { proxy_pass http://web; }
  }
}
