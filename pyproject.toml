[project]
name = "statmesh"
version = "0.4.0"
description = "Open statistics, one query surface: connectors, catalog, SQL, REST and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "httpx",
  "pyarrow",
  "duckdb",
  "fastapi",
  "uvicorn",
  "mcp>=2,<3",
  "sdmx1",
  "pycountry",
  "croniter",
  "openpyxl",
]

[project.optional-dependencies]
sdk = ["pandas", "polars"]

[project.scripts]
statmesh = "statmesh.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-socket", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statmesh"]
exclude = ["**/tests/**"]
force-include = { "docs/llms.txt" = "statmesh/llms.txt" }

[tool.pytest.ini_options]
testpaths = ["tests", "src/statmesh/connectors"]
addopts = '-m "not live" --disable-socket --allow-unix-socket --import-mode=importlib'
markers = ["live: hits the real network (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["statmesh"]
