# 200-question benchmark, run offline against the fixture catalog (`statmesh bench`).
# Fields: id, q, source (the source of the first expected key), topic (statmesh taxonomy), expected
# (series keys, 3 parts), geo, start, end. Every expected key was picked by reading the fixture
# data (series table, geos, periods): each one has a non-null value for `geo` inside [start, end].
# The expected answers come from the data, not from the search results. Never edit them to
# improve the score. The pinned search eval is evals/search_questions.yaml.
# Questions are written the way a journalist or a student would ask; the expected keys name the
# series that answers them.

